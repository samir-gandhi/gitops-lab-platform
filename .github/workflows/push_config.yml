name: Feature Deploy Push
on: 
  create:
    branches:
      - '*'
  push:
    paths:
      - terraform/**/*
      - .github/workflows/push_config.yml


jobs:
  init:
    name: Init
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: |-
        # sleep if it's a new branch or infra workflow runs so we can wait for the infra deploy to initialize
        toSleep=0
        if [[ "${{ github.event_name }}" == "create" ]]; then
          echo "infra_deploy_status=in-progress" >> $GITHUB_ENV
          toSleep=10
        fi
        if [[ "${{ github.event_name }}" == "push" ]]; then
          echo "Changed files:"
          git diff --name-only HEAD^ > /tmp/changed_files.txt
          grep -q -e "01-infrastructure" -e "workflows/push_infra.yml" /tmp/changed_files.txt
          test $? -eq 0 && toSleep=10
        fi
        sleep $toSleep

        # infra deploy status can be: "in-progress", "ready", "failed"
        echo "Checking if Infra Deploy is in progress..."
        while [ "${{ env.infra_deploy_status }}" != "ready" ]; do
          case "${{ env.infra_deploy_status }}" in
            "in-progress")
              echo "Infra Deploy is still in progress. Waiting..."
              sleep 30
              ;;
            "failed")
              echo "Infra Deploy failed. Exiting..."
              exit 1
              ;;
            *)
              echo "Unknown status: ${{ env.infra_deploy_status }}. Exiting..."
              exit 1
              ;;
          esac
        done

  fmt:
    runs-on: ubuntu-latest
    needs: [init]
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
      Check: ${{ needs.checks.outputs.configdeploy }}
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - name: fmt-check
      run: |
        echo ${Check}
        echo "${{ needs }}" | jq -r '.[]'
        terraform fmt -recursive -check .

  lint:
    if: ${{ needs.check-conditions.outputs.should-deploy == 'true' }}
    needs: [fmt]
    runs-on: ubuntu-latest
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - uses: actions/checkout@v4
    - uses: terraform-linters/setup-tflint@v4
      name: Setup TFLint
      with:
        tflint_version: latest

    - name: tflint
      run: |
        echo "***Running terraform lint***"
        tflint --recursive

  validate:
    if: ${{ needs.check-conditions.outputs.should-deploy == 'true' }}
    needs: [lint]
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - run: |-
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _tfdir=terraform
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        export TF_VAR_pingone_environment_name=${_branch}
        case $_branch in
          prod)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/prod/terraform.tfstate"
            ;;
          qa)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/qa/terraform.tfstate"
            ;;
          *)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/dev/${_branch}/terraform.tfstate"
            ;;
        esac
        terraform -chdir=${_tfdir} init \
          -backend-config="bucket=$TF_VAR_tf_state_bucket" \
          -backend-config="region=$TF_VAR_tf_state_region" \
          -backend-config="key=${_stateKey}"
        echo "***Running terraform validate***"
        terraform -chdir=${_tfdir} validate
        
  deploy:
    if: ${{ !contains(github.event.commits[0].message, '[skip ci]')}} && ${{ needs.check-conditions.outputs.should-deploy == 'true' }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - run: |-
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _tfdir=terraform
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        export TF_VAR_pingone_environment_name=${_branch}
        case $_branch in
          prod)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/prod/terraform.tfstate"
            ;;
          qa)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/qa/terraform.tfstate"
            ;;
          *)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/dev/${_branch}/terraform.tfstate"
            ;;
        esac
        terraform -chdir=${_tfdir} init \
          -backend-config="bucket=$TF_VAR_tf_state_bucket" \
          -backend-config="region=$TF_VAR_tf_state_region" \
          -backend-config="key=${_stateKey}"
        echo "***Running terraform apply***"
        terraform -chdir=${_tfdir} apply --auto-approve
name: Feature Deploy Push
on: 
  create:
    paths:
      - configuration/**/*
      - .github/workflows/push_config.yml
      - .github/workflows/drift_check.yml
  push:
    paths:
      - configuration/**/*
      - .github/workflows/push_config.yml
      - .github/workflows/drift_check.yml

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: hashicorp/setup-terraform@v3
    - name: fmt-check
      run: |
        branch=${GITHUB_REF#refs/heads/}
        case "$branch" in int-*|prod|qa) integrated=true ;; *) integrated=false ;; esac
        if $integrated; then
          cp configuration/pf_integration.stack.tpl configuration/pf_integration.stack.tf
        else
          rm -f configuration/pf_integration.stack.tf || true
        fi
        terraform fmt -recursive -check .

  lint:
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: terraform-linters/setup-tflint@v4
      name: Setup TFLint
      with:
        tflint_version: latest
    - name: tflint
      run: |
        branch=${GITHUB_REF#refs/heads/}
        case "$branch" in int-*|prod|qa) integrated=true ;; *) integrated=false ;; esac
        if $integrated; then
          cp configuration/pf_integration.stack.tpl configuration/pf_integration.stack.tf
        else
          rm -f configuration/pf_integration.stack.tf || true
        fi
        echo "***Running terraform lint***"
        tflint --recursive

  validate:
    needs: [lint]
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - run: |-
        branch=${GITHUB_REF#refs/heads/}
        case "$branch" in int-*|prod|qa) integrated=true ;; *) integrated=false ;; esac
        if $integrated; then
          cp configuration/pf_integration.stack.tpl configuration/pf_integration.stack.tf
        else
          rm -f configuration/pf_integration.stack.tf || true
        fi
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _tfdir=configuration
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        export TF_VAR_pingone_environment_name=${_branch}
        case $_branch in
          prod)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/prod/terraform.tfstate"
            ;;
          qa)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/qa/terraform.tfstate"
            ;;
          *)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/dev/${_branch}/terraform.tfstate"
            ;;
        esac
        terraform -chdir=${_tfdir} init \
          -backend-config="bucket=$TF_VAR_tf_state_bucket" \
          -backend-config="region=$TF_VAR_tf_state_region" \
          -backend-config="key=${_stateKey}"
        echo "***Running terraform validate***"
        terraform -chdir=${_tfdir} validate
        
  deploy:
    if: ${{ !contains(github.event.commits[0].message, '[skip ci]')}}
    name: Deploy
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Configure AWS Credentials
      run: |
        branch=${GITHUB_REF#refs/heads/}
        case "$branch" in int-*|prod|qa) integrated=true ;; *) integrated=false ;; esac
        if $integrated; then
          cp configuration/pf_integration.stack.tpl configuration/pf_integration.stack.tf
        else
          rm -f configuration/pf_integration.stack.tf || true
        fi
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        aws configure set aws_access_key_id ${AWS_ACCESS_KEY_ID}
        aws configure set aws_secret_access_key ${AWS_SECRET_ACCESS_KEY}
        aws configure set region ${AWS_REGION}
    - name: Check Infrastructure Status
      if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/int-') }}
      run: |
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        _aws_bucket="${TF_VAR_tf_state_bucket}"
        STATUS_FILE="s3://${_aws_bucket}/branch_infra_status/${_branch}/infra_status.json"
        
        # Check if the status file exists
        echo "Checking if infrastructure status file exists..."
        MAX_RETRIES=30
        RETRY_COUNT=0
        
        while ! aws s3 ls ${STATUS_FILE} &> /dev/null; do
          if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
            echo "Timeout waiting for infrastructure status file to be created"
            echo "Infrastructure deployment may not have started yet. Please ensure infrastructure is deployed first."
            exit 1
          fi
          
          echo "Infrastructure status file not found. Waiting for it to be created (attempt: $((RETRY_COUNT+1))/${MAX_RETRIES})..."
          RETRY_COUNT=$((RETRY_COUNT+1))
          sleep 10
        done
        
        echo "Infrastructure status file found. Checking status..."
        
        # Check the infrastructure status
        MAX_RETRIES=40
        RETRY_COUNT=0
        
        while true; do
          # Download the status file
          aws s3 cp ${STATUS_FILE} ./infra_status.json
          
          # Extract the status
          INFRA_STATUS=$(cat infra_status.json | grep -o '"infraStatus":"[^"]*"' | cut -d':' -f2 | tr -d '"')
          echo "Current infrastructure status: ${INFRA_STATUS}"
          
          if [ "${INFRA_STATUS}" = "ready" ] || [ "${INFRA_STATUS}" = "success" ]; then
            echo "Infrastructure is ready. Proceeding with configuration deployment."
            break
          elif [ "${INFRA_STATUS}" = "failed" ]; then
            echo "Infrastructure deployment failed. Cannot proceed with configuration deployment."
            exit 1
          elif [ "${INFRA_STATUS}" = "in-progress" ]; then
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "Timeout waiting for infrastructure deployment to complete"
              exit 1
            fi
            
            echo "Infrastructure deployment is still in progress. Waiting (attempt: $((RETRY_COUNT+1))/${MAX_RETRIES})..."
            RETRY_COUNT=$((RETRY_COUNT+1))
            sleep 10
          else
            echo "Unknown infrastructure status: ${INFRA_STATUS}. Exiting."
            exit 1
          fi
        done
    - uses: hashicorp/setup-terraform@v3
    - name: Terraform Init
      id: tf_init
      run: |-
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _tfdir=configuration
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        export TF_VAR_pingone_environment_name=${_branch}
        case $_branch in
          prod)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/prod/terraform.tfstate"
            ;;
          qa)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/qa/terraform.tfstate"
            ;;
          *)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/dev/${_branch}/terraform.tfstate"
            ;;
        esac
        terraform -chdir=${_tfdir} init \
          -backend-config="bucket=$TF_VAR_tf_state_bucket" \
          -backend-config="region=$TF_VAR_tf_state_region" \
          -backend-config="key=${_stateKey}"
        echo "TFDIR=${_tfdir}" >> $GITHUB_ENV
        echo "BRANCH=${_branch}" >> $GITHUB_ENV
    - name: Terraform Apply (first attempt)
      id: tf_apply_first
      run: |-
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _tfdir=configuration
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        export TF_VAR_pingone_environment_name=${_branch}
        ## set enable_infrastructure_integration based on branch name
        case "${_branch}" in
          int-*|prod|qa)
            export TF_VAR_enable_infrastructure_integration="true"
            ;;
          *)
            export TF_VAR_enable_infrastructure_integration="false"
            ;;
        esac
        export TF_IN_AUTOMATION=1
        export TF_CLI_ARGS_apply="-no-color -input=false"
        _status_file=$(mktemp)
        { terraform -chdir="${_tfdir}" apply --auto-approve 2>&1; echo "$?" > "${_status_file}"; } | tee "${_tfdir}/terraform-apply.out"
        terraform_exit_code=$(cat "${_status_file}")
        rm -f "${_status_file}"

        needs_retry=false
        if [ ${terraform_exit_code} -ne 0 ] && [ "${TF_VAR_enable_infrastructure_integration}" = "true" ] ; then
          if grep -qi "PingFederate API error" "${_tfdir}/terraform-apply.out" && \
            (grep -qi "Error summary: An error occurred while creating the OAuth Client" "${_tfdir}/terraform-apply.out" || \
            grep -qi "Result ID: server_error" "${_tfdir}/terraform-apply.out"); then
            needs_retry=true
          fi
        fi

        echo "exit_code=${terraform_exit_code}" >> "$GITHUB_OUTPUT"
        echo "needs_retry=${needs_retry}" >> "$GITHUB_OUTPUT"

    - name: Setup Kubernetes config (retry path)
      if: ${{ steps.tf_apply_first.outputs.needs_retry == 'true' }}
      run: |
        mkdir -p ${HOME}/.kube
        echo "${{ secrets.KUBECONFIG_YAML }}" | base64 --decode > ${HOME}/.kube/config
        kubectl version

    - name: Restart PingFederate admin pod (retry path)
      if: ${{ steps.tf_apply_first.outputs.needs_retry == 'true' }}
      run: |
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        K8S_NAMESPACE_PREFIX="${TF_VAR_k8s_namespace_prefix:-ping-devops-}"
        NAMESPACE="${K8S_NAMESPACE_PREFIX}${_branch}"
        PF_POD=$(kubectl get pods -n "${NAMESPACE}" | grep pingfederate-admin | awk '{print $1}')
        if [ -z "${PF_POD}" ]; then
          echo "ERROR: PingFederate admin pod not found in namespace ${NAMESPACE}"
          echo "The pod should exist after infrastructure deployment."
          exit 1
        fi
        echo "Found PingFederate admin pod: ${PF_POD}"
        echo "Restarting PingFederate admin pod..."
        kubectl delete pod "${PF_POD}" -n "${NAMESPACE}"

        echo "Waiting for PingFederate admin pod to restart..."
        MAX_WAIT_SECONDS=180
        INTERVAL=10
        ELAPSED=0
        READY=false
        while [ $ELAPSED -lt $MAX_WAIT_SECONDS ]; do
          echo "Checking pod status (${ELAPSED}s elapsed)..."
          PF_POD=$(kubectl get pods -n "${NAMESPACE}" | grep pingfederate-admin | awk '{print $1}')
          if [ -z "${PF_POD}" ]; then
            echo "Pod not yet recreated. Waiting..."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            continue
          fi
          RESTARTS=$(kubectl get pod "${PF_POD}" -n "${NAMESPACE}" -o jsonpath='{.status.containerStatuses[0].restartCount}')
          if [ ${RESTARTS:-0} -gt 1 ]; then
            echo "ERROR: PingFederate admin pod is in a crash loop with ${RESTARTS} restarts."
            kubectl describe pod "${PF_POD}" -n "${NAMESPACE}"
            break
          fi
          POD_STATUS=$(kubectl get pod "${PF_POD}" -n "${NAMESPACE}" -o jsonpath='{.status.phase}')
          READY_STATUS=$(kubectl get pod "${PF_POD}" -n "${NAMESPACE}" -o jsonpath='{.status.containerStatuses[0].ready}')
          if [ "$POD_STATUS" = "Running" ] && [ "$READY_STATUS" = "true" ]; then
            echo "PingFederate admin pod restarted successfully and is ready"
            READY=true
            sleep 20
            break
          fi
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done
        if [ "$READY" != "true" ]; then
          echo "ERROR: Timed out waiting for PingFederate admin pod to restart after ${MAX_WAIT_SECONDS} seconds"
          kubectl describe pod "${PF_POD}" -n "${NAMESPACE}"
          exit 1
        fi

    - name: Terraform Apply (retry)
      if: ${{ steps.tf_apply_first.outputs.needs_retry == 'true' }}
      id: tf_apply_retry
      run: |-
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _tfdir=configuration
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        export TF_VAR_pingone_environment_name=${_branch}

        export TF_IN_AUTOMATION=1
        export TF_CLI_ARGS_apply="-no-color -input=false"
        _status_file=$(mktemp)
        { terraform -chdir="${_tfdir}" apply --auto-approve 2>&1; echo "$?" >"${_status_file}"; } | tee "${_tfdir}/terraform-apply.out"
        terraform_exit_code=$(cat "${_status_file}")
        rm -f "${_status_file}"
        echo "exit_code=${terraform_exit_code}" >> $GITHUB_OUTPUT

    - name: Check Apply Result
      run: |
        NEEDS_RETRY='${{ steps.tf_apply_first.outputs.needs_retry }}'
        if [ "${NEEDS_RETRY}" = "true" ]; then
          CODE='${{ steps.tf_apply_retry.outputs.exit_code }}'
        else
          CODE='${{ steps.tf_apply_first.outputs.exit_code }}'
        fi
        echo "Final terraform apply exit code: ${CODE}"
        if [ "${CODE}" != "0" ]; then
          exit 1
        fi

    - name: Setup Kubernetes config
      run: |
        mkdir -p ${HOME}/.kube
        echo "${{ secrets.KUBECONFIG_YAML }}" | base64 --decode > ${HOME}/.kube/config
        kubectl version

    - name: Restart PingFederate admin pod
      run: |
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        
        # Set namespace prefix with default if not provided
        K8S_NAMESPACE_PREFIX="${TF_VAR_k8s_namespace_prefix:-ping-devops-}"
        NAMESPACE="${K8S_NAMESPACE_PREFIX}${_branch}"
        
        # Get pod name
        PF_POD=$(kubectl get pods -n "${NAMESPACE}" | grep pingfederate-admin | awk '{print $1}')
        
        if [ -z "${PF_POD}" ]; then
          echo "ERROR: PingFederate admin pod not found in namespace ${NAMESPACE}"
          echo "The pod should exist after infrastructure deployment."
          exit 1
        fi
        
        echo "Found PingFederate admin pod: ${PF_POD}"
        echo "Restarting PingFederate admin pod..."
        kubectl delete pod "${PF_POD}" -n "${NAMESPACE}"
        
        # Wait for pod to be restarted and ready in a loop with timeout
        echo "Waiting for PingFederate admin pod to restart..."
        MAX_WAIT_SECONDS=180  # 3 minutes
        INTERVAL=10  # check every 10 seconds
        ELAPSED=0
        READY=false
        
        while [ $ELAPSED -lt $MAX_WAIT_SECONDS ]; do
          echo "Checking pod status (${ELAPSED}s elapsed)..."
          
          # Check if pod exists
          PF_POD=$(kubectl get pods -n "${NAMESPACE}" | grep pingfederate-admin | awk '{print $1}')
          if [ -z "${PF_POD}" ]; then
            echo "Pod not yet recreated. Waiting..."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            continue
          fi
          
          # Check for crash loop
          RESTARTS=$(kubectl get pod "${PF_POD}" -n "${NAMESPACE}" -o jsonpath='{.status.containerStatuses[0].restartCount}')
          if [ $RESTARTS -gt 1 ]; then
            echo "ERROR: PingFederate admin pod is in a crash loop with ${RESTARTS} restarts."
            kubectl describe pod "${PF_POD}" -n "${NAMESPACE}"
            exit 1
          fi
          
          # Check if ready
          POD_STATUS=$(kubectl get pod "${PF_POD}" -n "${NAMESPACE}" -o jsonpath='{.status.phase}')
          READY_STATUS=$(kubectl get pod "${PF_POD}" -n "${NAMESPACE}" -o jsonpath='{.status.containerStatuses[0].ready}')
          
          if [ "$POD_STATUS" = "Running" ] && [ "$READY_STATUS" = "true" ]; then
            echo "PingFederate admin pod restarted successfully and is ready"
            READY=true
            # Wait a bit longer for services to fully initialize
            sleep 20
            break
          fi
          
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done
        
        if [ "$READY" != "true" ]; then
          echo "ERROR: Timed out waiting for PingFederate admin pod to restart after ${MAX_WAIT_SECONDS} seconds"
          kubectl describe pod "${PF_POD}" -n "${NAMESPACE}"
          exit 1
        fi
    - name: Replicate PingFederation Configuration
      run: |-
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _tfdir=02-configuration
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        _host="https://${_branch}-pingfederate-admin.ping-devops.com"
        _uri="/pf-admin-api/v1/cluster/replicate"
        curl -k -X POST "${_host}${_uri}" \
          -H "Content-Type: application/json" \
          -H "X-XSRF-Header: $(date +%s)" \
          -u "${TF_VAR_pingfederate_api_username}:${TF_VAR_pingfederate_api_password}"


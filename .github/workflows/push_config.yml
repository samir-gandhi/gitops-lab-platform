name: Feature Deploy Push
on: 
  workflow_run:
    workflows:
      - Infra Deploy
    types:
      - completed
  create:
    branches:
      - '*'
  push:
    paths:
      - terraform/**/*
      - .github/workflows/push_config.yml


jobs:
  check-conditions:
    runs-on: ubuntu-latest
    outputs:
      configdeploy: ${{ steps.check.outputs.configdeploy }}
    steps:
      - name: Determine Deployment Conditions
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "Triggered by Infra Deploy."
            echo "configdeploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "Triggered by config update."
            echo "configdeploy=true" >> $GITHUB_OUTPUT
          else
            echo "No need to deploy config."
            echo "configdeploy=false" >> $GITHUB_OUTPUT
          fi
  fmt:
    # if: ${{ needs.check-conditions.outputs.should-deploy == 'true' }}
    runs-on: ubuntu-latest
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
      Check: ${{ needs.check-conditions.outputs.configdeploy }}
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - name: fmt-check
      run: |
        echo ${Check}
        echo "${{ needs }}" | jq -r '.[]'
        terraform fmt -recursive -check .

  lint:
    if: ${{ needs.check-conditions.outputs.should-deploy == 'true' }}
    needs: [fmt]
    runs-on: ubuntu-latest
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - uses: actions/checkout@v4
    - uses: terraform-linters/setup-tflint@v4
      name: Setup TFLint
      with:
        tflint_version: latest

    - name: tflint
      run: |
        echo "***Running terraform lint***"
        tflint --recursive

  validate:
    if: ${{ needs.check-conditions.outputs.should-deploy == 'true' }}
    needs: [lint]
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - run: |-
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _tfdir=terraform
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        export TF_VAR_pingone_environment_name=${_branch}
        case $_branch in
          prod)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/prod/terraform.tfstate"
            ;;
          qa)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/qa/terraform.tfstate"
            ;;
          *)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/dev/${_branch}/terraform.tfstate"
            ;;
        esac
        terraform -chdir=${_tfdir} init \
          -backend-config="bucket=$TF_VAR_tf_state_bucket" \
          -backend-config="region=$TF_VAR_tf_state_region" \
          -backend-config="key=${_stateKey}"
        echo "***Running terraform validate***"
        terraform -chdir=${_tfdir} validate
        
  deploy:
    if: ${{ !contains(github.event.commits[0].message, '[skip ci]')}} && ${{ needs.check-conditions.outputs.should-deploy == 'true' }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - run: |-
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _tfdir=terraform
        _branch=$(echo "${GITHUB_REF}" | sed -e "s#refs/heads/##g")
        export TF_VAR_pingone_environment_name=${_branch}
        case $_branch in
          prod)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/prod/terraform.tfstate"
            ;;
          qa)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/qa/terraform.tfstate"
            ;;
          *)
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/dev/${_branch}/terraform.tfstate"
            ;;
        esac
        terraform -chdir=${_tfdir} init \
          -backend-config="bucket=$TF_VAR_tf_state_bucket" \
          -backend-config="region=$TF_VAR_tf_state_region" \
          -backend-config="key=${_stateKey}"
        echo "***Running terraform apply***"
        terraform -chdir=${_tfdir} apply --auto-approve
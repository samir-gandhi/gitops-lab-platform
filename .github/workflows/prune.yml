name: Delete Feature Environment

on: 
  delete:
    branches-ignore:
      - 'qa'
      - 'prod'

jobs:
  prune:
    if: ${{ !startsWith(github.event.ref, 'qa') || !startsWith(github.event.ref, 'prod')}}
    name: Destroy Feature Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - run: |-
        mkdir ${HOME}/.kube
        echo "${{ secrets.KUBECONFIG_YAML }}" | base64 --decode > ${HOME}/.kube/config
        kubectl version
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        echo "base: ${GITHUB_BASE_REF}"
        echo "ref: ${{ github.event.ref }}"
        _ref=$(echo "${{ github.event.ref }}" | sed -e "s#refs/heads/##g")
        _branch="$(echo "${_ref}" | sed -e "s#refs/heads/##g")"
        export TF_VAR_pingone_environment_name="${_branch}"
        export TF_VAR_k8s_helm_deployment_name="${_branch}"
        for _tfdir in "terraform" "01-infrastructure"; do
          if "${_tfdir}" == "terraform" ]; then
            _stateKey="${TF_VAR_tf_state_key_prefix_platform}/dev/${_branch}/terraform.tfstate"
          else
            _stateKey="${TF_VAR_tf_state_key_prefix_infrastructure}/dev/${_branch}/terraform.tfstate"
          fi
          terraform -chdir=${_tfdir} init \
          -backend-config="bucket=$TF_VAR_tf_state_bucket" \
          -backend-config="region=$TF_VAR_tf_state_region" \
          -backend-config="key=${_stateKey}"
          terraform -chdir=${_tfdir} destroy --auto-approve
        done

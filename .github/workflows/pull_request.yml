name: Pull Request Validation
on: 
  pull_request:
    paths:
      - 'configuration/**'
      - '.github/**'

jobs:
  check_target_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR is targeting qa or prod
        run: |
          if [[ "${{ github.base_ref }}" != "qa" && "${{ github.base_ref }}" != "prod" ]]; then
            echo "Pull requests can only target qa or prod branches. This PR targets ${{ github.base_ref }}."
            exit 1
          fi
          echo "Valid target branch: ${{ github.base_ref }}"
  
  fmt:
    needs: [check_target_branch]
    runs-on: ubuntu-latest
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: hashicorp/setup-terraform@v3
    - name: fmt-check
      run: |
        branch=${GITHUB_REF#refs/heads/}
        case "$branch" in int-*|prod|qa) integrated=true ;; *) integrated=false ;; esac
        if $integrated; then
          cp configuration/pf_integration.stack.tpl configuration/pf_integration.stack.tf
        else
          rm -f configuration/pf_integration.stack.tf || true
        fi
        terraform fmt -recursive -check .

  lint:
    needs: [fmt]
    runs-on: ubuntu-latest
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - uses: actions/checkout@v4

    - uses: terraform-linters/setup-tflint@v4
      name: Setup TFLint
      with:
        tflint_version: latest

    - name: TFLint
      run: |
        _branch="${GITHUB_BASE_REF}"
        echo "***Running terraform lint on configuration directory***"\
        case "$branch" in int-*|prod|qa) integrated=true ;; *) integrated=false ;; esac
        if $integrated; then
          cp configuration/pf_integration.stack.tpl configuration/pf_integration.stack.tf
        else
          rm -f configuration/pf_integration.stack.tf || true
        fi
        echo "***Running terraform lint***"
        tflint --recursive

  validate:
    needs: [lint]
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - name: Terraform Validate
      run: |-
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _branch="${GITHUB_BASE_REF}"
        case "$branch" in int-*|prod|qa) integrated=true ;; *) integrated=false ;; esac
        if $integrated; then
          cp configuration/pf_integration.stack.tpl configuration/pf_integration.stack.tf
        else
          rm -f configuration/pf_integration.stack.tf || true
        fi
        export TF_VAR_pingone_environment_name="${_branch}"
        export TF_VAR_k8s_helm_deployment_name="${_branch}"
        
        # Set state keys for both infrastructure and configuration based on branch
        case "${_branch}" in
          "prod")
            _configStateKey="${TF_VAR_tf_state_key_prefix_platform}/prod/terraform.tfstate"
            _infraStateKey="${TF_VAR_tf_state_key_prefix_infrastructure}/prod/terraform.tfstate"
            ;;
          "qa")
            _configStateKey="${TF_VAR_tf_state_key_prefix_platform}/qa/terraform.tfstate"
            _infraStateKey="${TF_VAR_tf_state_key_prefix_infrastructure}/qa/terraform.tfstate"
            ;;
          *)
            echo "ERROR: Unknown target branch: ${_branch}"
            exit 1
        esac
        
        # Validate both the configuration directory
        for _tfdir in "configuration"; do
          echo "Validating directory: ${_tfdir}"
          
          # Set the appropriate state key based on directory
          if [ "${_tfdir}" = "configuration" ]; then
            _stateKey="${_configStateKey}"
          else
            _stateKey="${_infraStateKey}"
          fi
          
          # Initialize and validate the directory
          terraform -chdir=${_tfdir} init \
            -backend-config="bucket=$TF_VAR_tf_state_bucket" \
            -backend-config="region=$TF_VAR_tf_state_region" \
            -backend-config="key=${_stateKey}"
          echo "***Running terraform validate for ${_tfdir}***"
          terraform -chdir=${_tfdir} validate
        done
        
  trivy:
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - uses: actions/checkout@v4
    - name: Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        hide-progress: false
        exit-code: '1'

  tfplan-config:
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      TERRAFORM_ENV_BASE64: ${{ secrets.TERRAFORM_ENV_BASE64 }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - name: Run Terraform Plan for Configuration
      run: |-
        echo $TERRAFORM_ENV_BASE64 | base64 -d > tfvars
        source tfvars
        _branch="${GITHUB_BASE_REF}"
        case "$branch" in int-*|prod|qa) integrated=true ;; *) integrated=false ;; esac
        if $integrated; then
          cp configuration/pf_integration.stack.tpl configuration/pf_integration.stack.tf
        else
          rm -f configuration/pf_integration.stack.tf || true
        fi
        export TF_VAR_pingone_environment_name="${_branch}"
        
        # Set configuration state key based on branch
        case "${_branch}" in
          "prod")
            _configStateKey="${TF_VAR_tf_state_key_prefix_platform}/prod/terraform.tfstate"
            ;;
          "qa")
            _configStateKey="${TF_VAR_tf_state_key_prefix_platform}/qa/terraform.tfstate"
            ;;
          *)
            echo "ERROR: Unknown target branch: ${_branch}"
            exit 1
        esac
        
        # Plan configuration changes
        _tfdir="configuration"
        echo "Planning configuration changes for environment: ${_branch}"
        
        # Initialize and plan the directory
        terraform -chdir=${_tfdir} init \
          -backend-config="bucket=$TF_VAR_tf_state_bucket" \
          -backend-config="region=$TF_VAR_tf_state_region" \
          -backend-config="key=${_configStateKey}"
        echo "***Running terraform plan for ${_tfdir}***"
        terraform -chdir=${_tfdir} plan -input=false